{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block body_class %}auth{% endblock %}
{% block content %}
<section class="auth-card card reveal">
  <a class="brand center" href="{{ url_for('index') }}"><span class="mark">⚡</span>StudySpark</a>
  <h1>Create your account</h1>
  <p class="muted">Your progress, plans and quiz scores are saved to it.</p>
  <form method="post" class="form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" class="field" maxlength="60" autocomplete="name" required autofocus>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" class="field" autocomplete="email" required>
    <label for="password">Password <span class="tiny">(at least 8 characters)</span></label>
    <input id="password" name="password" type="password" class="field" minlength="8" autocomplete="new-password" required>
    <button class="btn primary block" type="submit">Sign up</button>
  </form>
  <p class="tiny center">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
